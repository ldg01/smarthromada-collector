# Збирач дописів стрічки «Кабінету мешканця».
#
# Боти працюють тут, на комп'ютерах GitHub, а не на малому сервері сайту:
# там вони забирали весь процесор і сайт лягав. Кожне завдання — окремий
# паралельний запуск зі своїм часом; готові дописи йдуть на сервер одним
# пакетом. Ключ сервера — лише в секреті ARCHIVE_TOKEN (у журналах не видно).
#
# collector.mjs збирається з приватного репозиторію сайту
# (smart-hromada-cloudflare/archive-server/collector-src.ts) і кладеться сюди.

name: Збирач

on:
  schedule:
    - cron: "5 * * * *"      # щогодини: тривоги, оповіщення й розклад ботів (усі громади)
    - cron: "23 */2 * * *"   # раз на 2 год: новини, місця, інтернет (6 частин громад + GDELT)
    - cron: "41 */3 * * *"   # раз на 3 год: знімок погоди
    - cron: "55 4 * * 1"     # щопонеділка: «пульс», щоб GitHub не вимкнув розклад
  workflow_dispatch:
    inputs:
      job:
        description: "Завдання: all, weather, places, alerts, schedule, news, gdelt, oblast, raion:0/4, inet:0/6"
        default: all

permissions:
  contents: read

# GitHub вимикає розклад у репозиторії без змін 60 днів. Щопонеділка
# завдання keepalive записує сюди файл зі станом — і розклад живе роками.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - id: p
        run: |
          case "${{ github.event.schedule }}" in
            "5 * * * *")     echo 'jobs=["alerts","schedule"]' >> "$GITHUB_OUTPUT" ;;
            "23 */2 * * *")  echo 'jobs=["news","places","gdelt","raion:0/4","raion:1/4","raion:2/4","raion:3/4","oblast","inet:0/6","inet:1/6","inet:2/6","inet:3/6","inet:4/6","inet:5/6"]' >> "$GITHUB_OUTPUT" ;;
            "41 */3 * * *")  echo 'jobs=["weather"]' >> "$GITHUB_OUTPUT" ;;
            "55 4 * * 1")    echo 'jobs=["alerts"]' >> "$GITHUB_OUTPUT" ;;
            *)
              j="${{ github.event.inputs.job || 'all' }}"
              if [ "$j" = "all" ]; then echo 'jobs=["weather","places","alerts","schedule","news","gdelt","raion:0/4","raion:1/4","raion:2/4","raion:3/4","oblast","inet:0/6","inet:1/6","inet:2/6","inet:3/6","inet:4/6","inet:5/6"]' >> "$GITHUB_OUTPUT"
              else echo "jobs=[\"$j\"]" >> "$GITHUB_OUTPUT"; fi ;;
          esac

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    concurrency:
      group: collect-${{ matrix.job }}
      cancel-in-progress: false
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Збір і відправка
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          SERVER: https://api.smarthromada.com
          JOB: ${{ matrix.job }}
          MAX_MINUTES: "14"
          INET_STEPS: "2000"
          WORK_DIR: ${{ runner.temp }}/collector-data
        run: node collector.mjs

  keepalive:
    if: github.event.schedule == '55 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Пульс
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-alive
          git config user.name "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-alive
          git commit -m "Пульс збирача" || exit 0
          git push
